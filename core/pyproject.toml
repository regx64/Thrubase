[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thrubase"
version = "0.1.0"
description = "Climb a codebase: a terrain map of a Python repository and guided reading trails with comprehension checkpoints."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "regx64" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "tree-sitter>=0.25",
  "tree-sitter-python>=0.23",
  "networkx>=3.2",
  "numpy>=1.26",
  "pathspec>=0.12",
  "filelock>=3.13",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
]

[project.scripts]
thrubase = "thrubase.cli:main"

[project.urls]
Homepage = "https://github.com/regx64/thrubase"
Issues = "https://github.com/regx64/thrubase/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/thrubase"]
# The map-view build output is copied into src/thrubase/web/ before building and is git-ignored,
# so it has to be force-included explicitly.
artifacts = ["src/thrubase/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src/thrubase", "tests", "schema", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["src/thrubase/web/**"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["thrubase"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tree_sitter_python", "networkx", "networkx.*", "uvicorn", "tomli_w", "pathspec", "pathspec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "golden: compares against human-reviewed values for the validation repositories (needs THRUBASE_VALIDATION_DIR)",
  "perf: performance measurements on a synthetic repository",
]

[tool.coverage.run]
source = ["thrubase"]
omit = ["src/thrubase/tui.py"]
